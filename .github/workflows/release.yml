# .github/workflows/release.yml
# Release pipeline with SLSA L3 provenance + Cosign keyless signing.
#
# Triggered by: git tag push matching v*.*.* (e.g. v0.2.0)
#
# SLSA L3 requirements addressed:
#   1. Isolated build (GitHub-hosted runner, no self-hosted)
#   2. Parameterless build (no user-controlled build inputs)
#   3. Provenance generated by slsa-github-generator (trusted builder)
#   4. Signed with Cosign keyless (GitHub OIDC → Rekor transparency log)
#   5. Artifacts attested with in-toto attestation
#
# Supply-chain security controls:
#   - All actions pinned to immutable SHA.
#   - Provenance generation uses the official SLSA GitHub generator workflow.
#   - Container image signed before push to registry.
#   - SBOM attached as release asset.
#   - Verification instructions in release notes.
#
# Prerequisites:
#   - ghcr.io/your-org/tic package created and write permission granted.
#   - Repository Settings → Actions → Allow GitHub Actions to create releases.

name: Release (SLSA L3)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"

permissions:
  contents: write        # Create GitHub release.
  packages: write        # Push container to ghcr.io.
  id-token: write        # Cosign keyless signing via OIDC.
  attestations: write    # GitHub artifact attestations API.

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build Python wheel + SBOM
  # ---------------------------------------------------------------------------
  build-python:
    name: Build Python wheel
    runs-on: ubuntu-latest
    outputs:
      wheel-path: ${{ steps.build.outputs.wheel_path }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1
        with:
          version: "1.8.3"

      - name: Install dependencies
        run: poetry install --only main

      - name: Run tests (pre-release gate)
        run: |
          poetry install --with dev
          poetry run pytest -q

      - name: Build wheel
        id: build
        run: |
          poetry build --format wheel
          WHEEL=$(ls dist/*.whl | head -1)
          echo "wheel_path=${WHEEL}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX)
        run: |
          pip install cyclonedx-bom
          cyclonedx-py environment --output-format json --output-file sbom.json
          # Fail closed: a missing or empty SBOM must never ship with a release.
          test -s sbom.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: python-build
          path: |
            dist/*.whl
            sbom.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 2. Build + sign container image with Cosign keyless
  # ---------------------------------------------------------------------------
  build-container:
    name: Build & sign container image
    runs-on: ubuntu-latest
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36e0c5a4fa5d8f2d8b3e5a0b  # v3.9.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecce19b3d4dde44bc2c9a5b36bd26  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tic
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build image for scanning (local, no push)
        uses: docker/build-push-action@471d1dc4e07d5b5c1e2702e3f97e3c5e08b1af58  # v6.15.0
        with:
          context: .
          load: true
          tags: tic:scan
          cache-from: type=gha

      - name: Scan image (Trivy — fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          image-ref: tic:scan
          format: table
          exit-code: "1"
          ignore-unfixed: false
          vuln-type: os,library
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Build and push image
        id: build
        uses: docker/build-push-action@471d1dc4e07d5b5c1e2702e3f97e3c5e08b1af58  # v6.15.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build provenance attestation (OCI artifact).
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da  # v3.7.0

      - name: Sign container image (keyless, OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_TAG=$(echo "${TAGS}" | head -1)
          cosign sign --yes "${IMAGE_TAG}@${DIGEST}"
          echo "Image signed: ${IMAGE_TAG}@${DIGEST}"

      - name: Attest container image (GitHub attestation)
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018  # v2.2.3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tic
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---------------------------------------------------------------------------
  # 3. SLSA provenance generation (trusted builder)
  # ---------------------------------------------------------------------------
  slsa-provenance:
    name: Generate SLSA L3 provenance
    needs: [build-python]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build-python.outputs.wheel-path }}"
      upload-assets: true
      upload-tag-name: ${{ github.ref_name }}

  # ---------------------------------------------------------------------------
  # 4. Create GitHub release with verification instructions
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-python, build-container, slsa-provenance]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444306234f6dc2c6ff6f1e8a  # v4.1.9
        with:
          name: python-build
          path: dist/

      - name: Generate release notes with verification instructions
        id: release-notes
        env:
          VERSION: ${{ github.ref_name }}
          DIGEST: ${{ needs.build-container.outputs.image-digest }}
        run: |
          cat > release-notes.md << NOTES
          ## TIC ${VERSION}

          ### Verification (SLSA L3)

          **Verify Python wheel:**
          \`\`\`bash
          slsa-verifier verify-artifact \
            threat_intel_correlator-*.whl \
            --provenance-path multiple.intoto.jsonl \
            --source-uri github.com/${{ github.repository }} \
            --source-tag ${VERSION}
          \`\`\`

          **Verify container image:**
          \`\`\`bash
          cosign verify \
            ghcr.io/${{ github.repository_owner }}/tic:${VERSION} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/release.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          \`\`\`

          **SBOM:** \`sbom.json\` (CycloneDX JSON) attached below.

          **Container digest:** \`${DIGEST}\`
          NOTES

      - name: Create release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191  # v2.2.0
        with:
          body_path: release-notes.md
          files: |
            dist/*.whl
            dist/sbom.json
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
