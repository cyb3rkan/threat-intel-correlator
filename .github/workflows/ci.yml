# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1
        with:
          version: "2.3.4"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684  # v4.2.3
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ matrix.python-version }}-

      # Verify, do not regenerate. `poetry lock` here would silently re-resolve
      # dependencies on every run, making the build non-reproducible and the
      # cache key above meaningless. `poetry check --lock` exits 1 if
      # poetry.lock is out of sync with pyproject.toml, which is the failure we
      # actually want surfaced.
      - name: Verify lock file is in sync with pyproject.toml
        run: poetry check --lock

      # --all-extras is required: fastapi / uvicorn / python-multipart live in
      # the `api` extra, and tests/integration/test_api_*.py import them.
      # Without it those modules fail at collection time.
      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: Lint (ruff)
        run: poetry run ruff check src tests

      - name: Type check (mypy)
        run: poetry run mypy src

      - name: Run tests with coverage
        run: poetry run pytest -q

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1
        with:
          version: "2.3.4"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Verify lock file is in sync with pyproject.toml
        run: poetry check --lock

      # --all-extras so the audit covers the full shipped dependency surface,
      # including the `api` extra.
      - name: Install dependencies
        run: poetry install --with dev --all-extras

      - name: pip-audit (must match security.yml gate)
        run: |
          poetry run python -m pip install --upgrade "pip>=26.1.2"
          poetry run pip-audit --skip-editable

  frontend:
    name: Frontend (typecheck / lint / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b  # v4.0.3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  helm:
    name: Deployment manifests (lint / render / semantics)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814  # v4.2.0
        with:
          version: "v3.15.4"

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a  # v1.4.1
        with:
          version: "1.8.3"
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --with dev

      - name: helm lint
        run: helm lint deploy/helm/tic

      - name: helm template (render must succeed)
        run: helm template tic deploy/helm/tic > /dev/null

      - name: Manifest semantics
        # lint and template only prove the YAML is well-formed. These tests
        # assert the wiring: that Service labels satisfy the ServiceMonitor
        # selector, that the NetworkPolicy actually admits the ingress
        # controller and Prometheus, that every referenced PVC exists, and
        # that uploads stage off the PersistentVolume. Each of those failures
        # renders as valid YAML and only shows up at runtime.
        # The test files themselves only need pyyaml, but pytest loads
        # tests/conftest.py, which imports `tic` at module scope -- so the
        # package has to be installed for collection to succeed.
        run: |
          poetry run pytest tests/integration/test_helm_render.py \
                            tests/integration/test_raw_k8s_manifests.py \
                            -q --no-header -p no:cacheprovider --no-cov
