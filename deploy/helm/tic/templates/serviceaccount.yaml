# ServiceAccount referenced by the Deployment (serviceAccountName). Token
# automounting is disabled at the pod level (automountServiceAccountToken:
# false in deployment.yaml); this SA exists so the pod has a stable, minimal
# identity rather than the namespace default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tic.labels" . | nindent 4 }}
automountServiceAccountToken: false
