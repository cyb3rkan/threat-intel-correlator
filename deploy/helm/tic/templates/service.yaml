# ClusterIP Service fronting the API pod. Targets the container's named "http"
# port (deployment.yaml: ports[].name=http). The NetworkPolicy ingress rule
# and the frontend both reach the API through this Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tic.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tic.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "tic.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
